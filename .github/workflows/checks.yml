name: checks

# Runs the kit's local gates on every commit (push / pull request) and builds the release
# pack on a tag or a published release. **No `schedule`** — it runs only on those events.
# First-party actions only; no secrets. The same checks run locally via `make gate` — CI is
# the enforcement layer, not a second source of truth. Security scans (trufflehog +
# gitleaks) stay a local release step: `make security`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gate:
    name: gate (bundles · links · frontmatter · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: make gate

  release-pack:
    name: release pack (build + twine check)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build twine
      - run: make gate
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
